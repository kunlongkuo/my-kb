  :root { __VARS__ }

const D = __D__, TOKENS = __TOKENS__, LANG = "__LANG__", VEIL_IN = __VIN__, VEIL_OUT = __VOUT__, TAIL = __TAIL__;

__LIB__
__SCENES__
const tl = gsap.timeline({ paused: true });
// Scenes measure text (offsetWidth / offsetHeight) to centre and stack it, so the scene is built only once both font files
// are in: built straight away it measured a fallback font and every centred Latin line sat up to 90 px off (2026-11-17,
// onion B4's title). The fonts are loaded explicitly: a face loads only when text first uses it, so document.fonts.ready
// before the build waits for nothing. The timeline is registered at the end of the build (HyperFrames waits for it, then for

window.__built = Promise.all([...document.fonts].map(f => f.load())).catch(() => {}).then(() => {

SCENES["__SCENE__"](P);
overlays(P);
tl.set({}, {}, D);
window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
});
